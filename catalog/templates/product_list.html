{% extends 'base.html' %}
{% block content %}
<div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            {% for prdct in product %}
            <div class="col">
                <div class="card shadow-sm">
                    <div class="card-body">
                    <img src="{{ prdct.image.url }}" alt="Thumbnail" class="bd-placeholder-img card-img-top" height="300" width="100%">
                    <p class="card-text">{{ prdct.name }}</p>
                    <p class="card-text">{{ prdct.description|slice:":100" }}</p>
                    <div class="d-flex justify-content-between align-items-center">
                        <div class="btn-group">
                            <a class="btn btn-primary" href="{% url 'catalog:product_detail' prdct.pk %}" role="button">Подробнее</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
