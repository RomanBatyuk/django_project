{% extends "catalog/base.html" %}

{% block content %}
  <h2>Подтвердите отмену публикации продукта "{{ object.title }}"</h2>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Подтвердить</button>
    <a href="{% url 'catalog:product_detail' object.pk %}">Отмена</a>
  </form>
{% endblock %}
